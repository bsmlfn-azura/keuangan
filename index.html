<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>Keuangan Fix Final</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); padding: 16px; padding-bottom: 100px; }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* Cards */
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 16px; }
        h2 { font-size: 14px; color: #64748b; text-transform: uppercase; margin-bottom: 12px; }
        
        /* Form */
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #334155; }
        input, select { width: 100%; height: 44px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 16px; }
        button { width: 100%; height: 44px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:active { opacity: 0.8; }

        /* Table */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 400px; font-size: 13px; }
        th, td { padding: 10px; border-bottom: 1px solid #f1f5f9; text-align: left; }
        th { background: #f8fafc; font-size: 11px; }
        
        /* Stats */
        .stats { display: flex; gap: 10px; margin-bottom: 16px; }
        .stat { flex: 1; background: white; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
        .stat-val { font-weight: bold; font-size: 14px; margin-top: 4px; }

        /* Utils */
        .text-g { color: #16a34a; }
        .text-r { color: #dc2626; }
        #loader { position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 99; display: none; justify-content: center; align-items: center; flex-direction: column; }
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .bg-in { background: #dcfce7; color: #166534; }
        .bg-out { background: #fee2e2; color: #991b1b; }
        .del-btn { border: none; background: none; color: red; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>

    <div id="loader">
        <div>Memproses...</div>
    </div>

    <div class="container">
        <header style="margin-bottom:16px;">
            <h1>💰 KeuanganKu</h1>
        </header>

        <div class="stats">
            <div class="stat"><div class="stat-lbl">Masuk</div><div class="stat-val text-g" id="valIn">0</div></div>
            <div class="stat"><div class="stat-lbl">Keluar</div><div class="stat-val text-r" id="valOut">0</div></div>
            <div class="stat"><div class="stat-lbl">Saldo</div><div class="stat-val" id="valBal">0</div></div>
        </div>

        <div class="card">
            <h2>Input Transaksi</h2>
            <form id="myForm">
                <div class="form-group">
                    <label>Jenis</label>
                    <select id="inpType">
                        <option value="income">Pemasukan</option>
                        <option value="expense">Pengeluaran</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nominal</label>
                    <input type="number" id="inpAmt" placeholder="0" required>
                </div>
                <div class="form-group">
                    <label>Tanggal</label>
                    <input type="date" id="inpDate" required>
                </div>
                <div class="form-group">
                    <label>Keterangan</label>
                    <input type="text" id="inpDesc" placeholder="Isi detail..." required>
                </div>
                <button type="submit">SIMPAN DATA</button>
            </form>
        </div>

        <div class="card">
            <h2>Riwayat</h2>
            <div class="table-wrap">
                <table id="myTable">
                    <thead><tr><th>Tgl</th><th>Ket</th><th>Jns</th><th>Nominal</th><th></th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. SETTING URL (WAJIB DIISI)
        // ==========================================
        const API_URL = "https://script.google.com/macros/s/AKfycbylXoHcASk47wRnPgumeuGrpufJuf5NaIPx8r2J2ckQlBImgftKh1cD2cMzQFmPUGw/exec"; 

        let transactions = [];

        // 2. INISIALISASI
        window.onload = function() {
            document.getElementById('inpDate').valueAsDate = new Date();
            loadData();
        };

        document.getElementById('myForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            await saveData();
        });

        // 3. FUNGSI FETCH YANG DIPERBAIKI (Toleran)
        function safeFetch(url, options = {}) {
            return new Promise((resolve, reject) => {
                if(API_URL.includes("PASTE")) { reject("URL belum diisi!"); return; }

                const controller = new AbortController();
                const id = setTimeout(() => controller.abort(), 15000);

                fetch(url, { ...options, signal: controller.signal })
                    .then(res => {
                        clearTimeout(id);
                        if (!res.ok) throw new Error("Gagal konek (Status: " + res.status + ")");
                        return res.text().then(txt => {
                            try { return JSON.parse(txt); } // Coba parse JSON
                            catch(e) { throw new Error("Respon bukan JSON: " + txt.substring(0,50)); }
                        });
                    })
                    .then(data => resolve(data))
                    .catch(err => {
                        clearTimeout(id);
                        reject(err.message);
                    });
            });
        }

        // 4. LOAD DATA
        async function loadData() {
            showLoading(true);
            try {
                const data = await safeFetch(API_URL + "?action=read");
                if(data.status === 'success') {
                    transactions = data.data;
                    render();
                }
            } catch(err) {
                console.error("Load Error:", err);
                // Jangan alert saat load awal biar tidak ganggu
            } finally {
                showLoading(false);
            }
        }

                // 5. SAVE DATA (MENGGUNAKAN METODE GET - ANTI FAILED TO FETCH)
        async function saveData() {
            showLoading(true);
            
            // Siapkan data
            const dataPayload = {
                action: 'add',
                id: Date.now(),
                type: document.getElementById('inpType').value,
                amount: parseFloat(document.getElementById('inpAmt').value),
                date: document.getElementById('inpDate').value,
                description: document.getElementById('inpDesc').value
            };

            console.log("Mengirim via GET:", dataPayload);

            try {
                // PERUBAHAN UTAMA: Kita ubah data menjadi Parameter URL
                const params = new URLSearchParams(dataPayload).toString();
                const finalUrl = `${API_URL}?${params}`;

                // Lakukan Fetch dengan method GET (Tanpa body, tanpa header kompleks)
                const res = await safeFetch(finalUrl, { method: 'GET' });

                console.log("Respon Server:", res);

                if(res.status === 'success') {
                    alert("BERHASIL DISIMPAN!");
                    document.getElementById('myForm').reset();
                    document.getElementById('inpDate').valueAsDate = new Date();
                    await loadData();
                } else {
                    alert("GAGAL: " + (res.message || "Unknown Error"));
                }

            } catch(err) {
                console.error("Save Error:", err);
                alert("ERROR KONEKSI: " + err);
            } finally {
                showLoading(false);
            }
        }

                // 6. DELETE (JUGA MENGGUNAKAN GET)
        async function delData(id) {
            if(!confirm("Hapus?")) return;
            showLoading(true);
            try {
                const params = new URLSearchParams({ action: 'delete', id: id }).toString();
                const finalUrl = `${API_URL}?${params}`;

                const res = await safeFetch(finalUrl, { method: 'GET' });
                
                if(res.status === 'success') {
                    await loadData();
                    alert("Terhapus");
                } else {
                    alert("Gagal Hapus: " + res.message);
                }
            } catch(err) {
                alert("Gagal Hapus: " + err);
            } finally {
                showLoading(false);
            }
        }
        // 7. RENDER
        function render() {
            const tb = document.getElementById('tableBody');
            tb.innerHTML = '';
            
            let totalIn = 0, totalOut = 0;

            transactions.forEach(t => {
                const isInc = t.type === 'income';
                if(isInc) totalIn += t.amount; else totalOut += t.amount;

                tb.innerHTML += `
                    <tr>
                        <td>${t.date}</td>
                        <td>${t.description}</td>
                        <td><span class="badge ${isInc?'bg-in':'bg-out'}">${isInc?'IN':'OUT'}</span></td>
                        <td class="${isInc?'text-g':'text-r'}">${formatRp(t.amount)}</td>
                        <td><button class="del-btn" onclick="delData(${t.id})">&times;</button></td>
                    </tr>
                `;
            });

            document.getElementById('valIn').innerText = formatRp(totalIn);
            document.getElementById('valOut').innerText = formatRp(totalOut);
            document.getElementById('valBal').innerText = formatRp(totalIn - totalOut);
        }

        // Helpers
        function showLoading(s) { document.getElementById('loader').style.display = s ? 'flex' : 'none'; }
        function formatRp(n) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n); }
    </script>
</body>
</html>
